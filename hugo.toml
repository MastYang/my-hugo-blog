baseURL = 'https://yangyifan.net/'
languageCode = 'zh-cn'
title = '杨一帆的小窝'
theme = 'PaperMod'

[params]
  env = "production"
  title = "杨一帆的小窝"
  description = "欢迎来到我的个人博客"

  # 元信息控制（核心修改部分）
  hideMeta = false           # 开启元信息展示
  showWordCount = true       # 关键：显示字数
  showReadingTime = false    # 不显示预计阅读时间
  dateFormat = ""            # 关键：把日期格式清空，这样时间就不会显示出来了

  # 排版与列表设置
  hideSummary = true         # 首页列表中只显示文章标题，隐藏摘要

  # 顶栏导航与主题选项
  defaultTheme = "auto"      # 自动跟随系统（深色/浅色模式）

[params.profileMode]
  enabled = false            # 开启文章标题列表模式
