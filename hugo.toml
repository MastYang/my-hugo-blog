baseURL = 'https://yangyifan.net/'
languageCode = 'zh-cn'
title = '杨一帆的小窝'
theme = 'PaperMod'

[params]
  env = "production"
  title = "杨一帆的小窝"
  description = "欢迎来到我的个人博客"

  # 元信息控制
  hideMeta = true            # 关键：彻底隐藏标题下方的日期、字数等信息

  # 排版与列表设置
  hideSummary = true         # 只显示文章标题，隐藏下方摘要段落
  showReadingTime = false    # 不显示阅读时间
  showWordCount = true      # 显示字数

  # 顶栏导航与主题选项
  defaultTheme = "auto"      # 自动跟随系统（深色/浅色模式）

[params.profileMode]
  enabled = false            # 开启文章标题列表模式

[params.homeInfoParams]
  Title = "欢迎来到杨一帆的小窝"
  Content = "记录我的世界"
